# ═══════════════════════════════════════════════
#  RETRO-TERM · Broker Mosquitto
#  Dos listeners:
#    1883 -> MQTT nativo (TCP)  ->  lo usa el ESP32
#    9001 -> MQTT sobre WebSocket -> lo usa el dashboard (navegador)
# ═══════════════════════════════════════════════

# --- MQTT nativo (ESP32 / PubSubClient) ---
listener 1883
protocol mqtt

# --- MQTT sobre WebSocket (navegador / MQTT.js) ---
listener 9001
protocol websockets

# Persistencia (los mensajes retained sobreviven reinicios del broker)
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# --- Acceso ---
# Para empezar rapido dejamos acceso anonimo (red local / homelab).
# Cuando lo lleves al homelab de verdad: pon 'allow_anonymous false',
# crea usuarios con  ->  mosquitto_passwd -c /mosquitto/config/passwd term01
# y descomenta la linea password_file de abajo.
allow_anonymous true
# password_file /mosquitto/config/passwd
